services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
      POSTGRES_DB: enterprise_erp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - erp_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d enterprise_erp"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  erp_postgres:
